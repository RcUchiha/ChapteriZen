# Workflow verificado corriendo de punta a punta en GitHub Actions el 2026-07-19.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Los 2 tests que instancian una QApplication real ya setean esto
      # ellos mismos antes de importar PyQt6 (os.environ.setdefault) --
      # se repite acá como defensa extra, explícito en vez de implícito.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias de sistema para PyQt6 (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyflakes

      - name: pytest
        run: python -m pytest tests/ -v

      - name: pyflakes
        run: python -m pyflakes chapterizen/ tests/ scripts/
