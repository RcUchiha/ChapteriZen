[project]
name = "chapterizen"
version = "0.0.9"
description = "Generador automatico de chapters para episodios de anime."
authors = [{ name = "CiferrC" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
chapterizen = "chapterizen.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chapterizen*"]
